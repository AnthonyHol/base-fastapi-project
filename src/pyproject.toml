[dependency-groups]
dev = [
    "ruff>=0.1.7,<0.2",
    "bump-pydantic>=0.6.1,<0.7",
    "pytest>=8.1.1,<9",
    "pytest-asyncio>=0.21.0,<0.22",
    "pytest-factoryboy>=2.5.1,<3",
    "pytest-mock>=3.14.0,<4",
    "pytest-repeat>=0.9.3,<0.10",
    "types-redis>=4.6.0.0,<5",
    "types-pytz>=2024.1.0.20240417,<2025",
    "types-aiofiles>=24.1.0.20240626,<25",
